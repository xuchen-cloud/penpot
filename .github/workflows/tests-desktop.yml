name: "CI: Desktop"

defaults:
  run:
    shell: bash

on:
  workflow_dispatch:

  pull_request:
    paths:
      - ".github/workflows/tests-desktop.yml"
      - "desktop/**"
      - "plugins/apps/web-to-penpot-plugin/**"
      - "plugins/package.json"
      - "plugins/pnpm-lock.yaml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

    types:
      - opened
      - synchronize
      - ready_for_review

  push:
    branches:
      - develop
      - staging

    paths:
      - ".github/workflows/tests-desktop.yml"
      - "desktop/**"
      - "plugins/apps/web-to-penpot-plugin/**"
      - "plugins/package.json"
      - "plugins/pnpm-lock.yaml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-desktop:
    if: ${{ !github.event.pull_request.draft }}
    name: "Desktop ${{ matrix.target }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.0.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plugins/pnpm-lock.yaml

      - name: Install plugin dependencies
        run: pnpm --dir plugins install --frozen-lockfile

      - name: Prepare bundled plugins
        run: pnpm --dir desktop prepare:web-to-penpot

      - name: Check runner architecture
        run: |
          host_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$host_target" != "${{ matrix.target }}" ]]; then
            echo "Expected ${{ matrix.target }}, got $host_target" >&2
            exit 1
          fi

      - name: Install Rust check components
        run: rustup component add rustfmt clippy

      - name: Check format
        working-directory: desktop/src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: desktop/src-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --locked
