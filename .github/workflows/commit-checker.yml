name: "Commit Message Check"

on:
  workflow_dispatch:

jobs:
  check-commit-message:
    name: Commit policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check selected commit
        run: ./scripts/check-commit --range "${{ github.sha }}^..${{ github.sha }}"
