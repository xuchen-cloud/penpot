[package]
name = "penpot-desktop"
version = "2.17.0"
description = "Self-contained Penpot desktop runtime"
authors = ["Penpot Desktop contributors"]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[lib]
name = "penpot_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "penpot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.8.9"
directories = "6.0.0"
fs2 = "0.4.3"
hyper = { version = "1.8.1", features = ["client", "http1"] }
http-body-util = "0.1.3"
hyper-util = { version = "0.1.20", features = ["client-legacy", "http1", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.4"
tempfile = "3.24.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
tower-http = { version = "0.6.8", features = ["fs", "limit", "set-header"] }
url = "2.5.8"
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[dev-dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
tempfile = "3.24.0"
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }
