[package]
name = "penpot-desktop"
version = "2.17.0"
description = "Self-contained Penpot desktop runtime"
authors = ["Penpot Desktop contributors"]
edition = "2024"
license = "MPL-2.0"
rust-version = "1.85"

[lib]
name = "penpot_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "penpot-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
axum = "0.8.9"
directories = "6.0.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri = { version = "2.11.5", features = ["tray-icon"] }
tempfile = "3.24.0"
thiserror = "2.0.18"
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "time"] }
tokio-util = "0.7.19"
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }
uuid = { version = "1.21.0", features = ["serde", "v4"] }

[dev-dependencies]
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
tempfile = "3.24.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }
